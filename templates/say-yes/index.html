<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hãy nói đồng ý! — Crushify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Dancing+Script:wght@500&family=Be+Vietnam+Pro:wght@400;600&display=swap">
<link rel="stylesheet" href="say-yes.css">
</head>
<body data-ph="intro">
<div id="tabs"><button data-v="ed">Chỉnh sửa</button><button data-v="pv">Xem trước</button></div>
<aside id="editor">
  <h2>Hãy nói đồng ý! <small>Tạo lời tỏ tình</small></h2>
  <details open><summary>Người trong cuộc</summary>
    <label>Tên bạn<input data-k="sender"></label>
    <label>Tên người nhận<input data-k="receiver"></label>
    <label>Biệt danh<input data-k="nickname"></label>
  </details>
  <details open><summary>Câu hỏi</summary>
    <label>Câu hỏi chính<input data-k="question"></label>
    <label>Phụ đề<input data-k="subtitle"></label>
    <label>Chữ nút đồng ý<input data-k="yesLabel"></label>
    <label>Chữ nút từ chối<input data-k="noLabel"></label>
  </details>
  <details><summary>Lời nhắn khi đồng ý</summary>
    <label>Tiêu đề<input data-k="yesHeadline"></label>
    <label>Thông điệp ăn mừng<textarea data-k="yesMessage" rows="2"></textarea></label>
    <label>Thư riêng<textarea data-k="letter" rows="4"></textarea></label>
    <label>Chữ ký<input data-k="signature"></label>
    <label>Ngày đặc biệt<input type="date" data-k="specialDate"></label>
  </details>
  <details><summary>Phản hồi khi từ chối</summary>
    <label>Nội dung<textarea data-k="noMessage" rows="3"></textarea></label>
    <label>Chữ nút quay lại<input data-k="noBackLabel"></label>
    <label class="row"><input type="checkbox" data-k="showNoMessage"> Hiện lời phản hồi</label>
  </details>
  <details><summary>Kỷ niệm <span id="cnt"></span></summary>
    <p class="hint">Tối đa 6 ảnh. Kéo thả để đổi thứ tự.</p>
    <div id="phs"></div>
    <label class="btn">Tải ảnh lên<input id="up" type="file" accept="image/*" multiple hidden></label>
  </details>
  <details><summary>Giao diện &amp; hiệu ứng</summary>
    <div id="themes"></div>
    <label>Kiểu hiệu ứng<select id="anim"><option value="cinematic">Điện ảnh</option><option value="magical">Kỳ diệu</option><option value="dreamy">Mộng mơ</option><option value="minimal">Tối giản</option></select></label>
    <label class="row"><input type="checkbox" data-k="particles"> Bật hạt sáng</label>
    <label class="row"><input type="checkbox" data-k="autoRotate"> Tự xoay góc nhìn</label>
  </details>
  <div class="actions"><button id="asRecipient">Xem thử như người nhận</button><button id="save">Lưu nháp</button><button id="exp">Tải dữ liệu JSON</button></div>
  <p id="msg" class="hint"></p>
</aside>
<main id="stage">
  <canvas id="c"></canvas>
  <div id="veil"></div>
  <header class="hud">
    <a id="home" href="../../index.html">← Crushify</a>
    <button id="snd">Bật âm thanh</button><button id="hHeart">Trái tim</button><button id="hBox">Hộp nhẫn</button><button id="reset">Đặt lại</button><button id="rot">Xoay</button><button id="prt">Hạt sáng</button><button id="replay">Phát lại</button>
    <button id="backEdit" class="only-edit">Quay lại chỉnh sửa</button>
  </header>
  <p id="note" hidden>Chế độ 2D: Không thể sử dụng WebGL hoặc Three.js nên cảnh 3D đã tắt.</p>
  <section id="ask" class="card">
    <p id="qSub"></p>
    <h1 id="qMain"></h1>
    <div class="btns"><button id="yesB" class="yes"></button><button id="noB" class="no"></button></div>
  </section>
  <section id="yesP" class="card">
    <h2 id="yesH"></h2>
    <p id="yesM"></p>
    <div id="yesPh"></div>
    <p id="yesL" class="letter"></p>
    <p id="yesS" class="sig"></p>
    <p id="yesN" class="meta"></p>
    <button id="yesRe" class="no">Xem lại màn chúc mừng</button>
  </section>
  <section id="noP" class="card">
    <p id="noM"></p>
    <div class="btns"><button id="noBack" class="yes"></button><button id="noClose" class="no">Đóng</button></div>
  </section>
</main>
<script src="say-yes.js?v=2"></script>
</body>
</html>
